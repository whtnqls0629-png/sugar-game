<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUGAR — Ant Motion Test</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d9d6cf;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// ==================================================
// SPRITE DATA (GAME_BIBLE §18, §19)
// ==================================================

// Rendering scale only. Source PNGs are never resized.
// Per-state values make the ant read as the same body size in every
// state (idle 0.40 is the reference; matched on abdomen/body size).
const SPRITE_SCALE = {
  idle: 0.40,
  walk: 0.53,
  run: 0.44,
  turn: 0.44,
  interact: 0.40,
  dead: 0.40
};

const ANIMATIONS = {
  idle:     { count: 2, interval: 400, anchorX: 172, anchorY: 93,  loop: true  },
  walk:     { count: 4, interval: 130, anchorX: 136, anchorY: 84,  loop: true  },
  run:      { count: 4, interval: 90,  anchorX: 162, anchorY: 95,  loop: true  },
  turn:     { count: 2, interval: 300, anchorX: 87,  anchorY: 105, loop: false },
  interact: { count: 3, interval: 280, anchorX: 188, anchorY: 95,  loop: false },
  dead:     { count: 2, interval: 450, anchorX: 104, anchorY: 101, loop: false }
};

for (const [name, anim] of Object.entries(ANIMATIONS)) {
  anim.frames = [];
  for (let i = 1; i <= anim.count; i++) {
    anim.frames.push(`sprites/${name}/${name}_${String(i).padStart(2, "0")}.png`);
  }
}

// Movement speed in screen pixels per second
const WALK_SPEED = 70;
const RUN_SPEED = 170;

// turn frame mapping (index into ANIMATIONS.turn.images)
// turn_01: larger, darker eyes and shorter abdomen -> faces the viewer
// turn_02: smaller eyes and longer abdomen -> faces away
const TURN_FRONT = 0;   // ArrowDown / S
const TURN_BACK = 1;    // ArrowUp / W

// ==================================================
// CANVAS
// ==================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  // resizing the canvas resets context state, so set this every time
  ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);
resize();

// ==================================================
// ASSET LOADING
// ==================================================

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load " + src));
    img.src = src;
  });
}

async function loadAnimations() {
  for (const anim of Object.values(ANIMATIONS)) {
    anim.images = await Promise.all(anim.frames.map(loadImage));
  }
}

// ==================================================
// INPUT
// e.code is used so keys work regardless of keyboard
// language (Korean input mode turns e.key "a" into "ㅁ").
// ==================================================

const held = new Set();
const pressed = new Set();

const GAME_KEYS = new Set([
  "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
  "KeyA", "KeyD", "KeyW", "KeyS",
  "ShiftLeft", "ShiftRight", "KeyE",
  "KeyK"  // DEBUG: dead animation test only
]);

// Some setups (keyboard remappers, remote desktop, some IMEs) send
// key events with an empty e.code. Fall back to e.key, then keyCode.
const KEY_FALLBACK = {
  arrowleft: "ArrowLeft", arrowright: "ArrowRight",
  arrowup: "ArrowUp", arrowdown: "ArrowDown",
  a: "KeyA", d: "KeyD", w: "KeyW", s: "KeyS", e: "KeyE", k: "KeyK",
  "ㅁ": "KeyA", "ㅇ": "KeyD", "ㅈ": "KeyW", "ㄴ": "KeyS", "ㄷ": "KeyE", "ㅏ": "KeyK",
  shift: "ShiftLeft"
};
const KEYCODE_FALLBACK = {
  37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown",
  65: "KeyA", 68: "KeyD", 87: "KeyW", 83: "KeyS", 69: "KeyE", 75: "KeyK",
  16: "ShiftLeft"
};

function keyId(e) {
  if (e.code) return e.code;
  return KEY_FALLBACK[(e.key || "").toLowerCase()] || KEYCODE_FALLBACK[e.keyCode] || "";
}

window.addEventListener("keydown", e => {
  const id = keyId(e);
  if (!GAME_KEYS.has(id)) return;
  e.preventDefault();
  if (!held.has(id)) pressed.add(id);
  held.add(id);
});

window.addEventListener("keyup", e => {
  held.delete(keyId(e));
});

window.addEventListener("blur", () => held.clear());

function axis(neg, pos) {
  const n = neg.some(k => held.has(k)) ? 1 : 0;
  const p = pos.some(k => held.has(k)) ? 1 : 0;
  return p - n;
}

// ==================================================
// PLAYER
// ==================================================

const player = {
  // world position of the BODY anchor
  x: 0,
  y: 0,
  facing: -1,   // -1 = left (sprite default), 1 = right (flipped)
  anim: "idle",
  frame: 0,
  frameTime: 0,
  finished: false
};

function setAnim(name) {
  if (player.anim === name) return;
  player.anim = name;
  player.frame = 0;
  player.frameTime = 0;
  player.finished = false;
}

function updateAnimation(dt) {
  const anim = ANIMATIONS[player.anim];
  player.frameTime += dt;

  while (player.frameTime >= anim.interval) {
    player.frameTime -= anim.interval;
    if (anim.loop) {
      player.frame = (player.frame + 1) % anim.count;
    } else if (player.frame < anim.count - 1) {
      player.frame++;
    } else {
      // hold the last frame for one full interval, then report done
      player.finished = true;
      player.frameTime = 0;
    }
  }
}

// Priority: DEAD > INTERACT > RUN > WALK > TURN > IDLE
function updatePlayer(dt) {
  const dx = axis(["ArrowLeft", "KeyA"], ["ArrowRight", "KeyD"]);
  const dy = axis(["ArrowUp", "KeyW"], ["ArrowDown", "KeyS"]);
  const running = held.has("ShiftLeft") || held.has("ShiftRight");

  // ---- DEAD: final state, ignores all input until page refresh
  if (player.anim === "dead") return;

  // DEBUG: K plays the dead animation for sprite checking only.
  // Not a game mechanic. Remove when a real death trigger exists.
  if (pressed.has("KeyK")) {
    setAnim("dead");
    return;
  }

  // ---- INTERACT: plays once, movement ignored until it finishes
  if (player.anim === "interact") {
    if (player.finished) setAnim("idle");
    else return;
  }
  if (pressed.has("KeyE")) {
    setAnim("interact");
    return;
  }

  // ---- RUN / WALK: horizontal only. Right = mirrored left sprite.
  if (dx !== 0) {
    player.facing = dx;
    const speed = running ? RUN_SPEED : WALK_SPEED;
    player.x += dx * speed * dt / 1000;
    setAnim(running ? "run" : "walk");

    // keep the body on screen
    const margin = 40;
    player.x = Math.max(margin, Math.min(W - margin, player.x));
    return;
  }

  // ---- TURN: up/down only changes the view, no Y movement yet
  if (dy !== 0) {
    setAnim("turn");
    player.frame = dy < 0 ? TURN_BACK : TURN_FRONT;
    player.frameTime = 0;  // hold the frame while the key is down
    return;
  }

  // ---- IDLE
  setAnim("idle");
}

// ==================================================
// DRAW
// ==================================================

function drawPlayer() {
  const anim = ANIMATIONS[player.anim];
  const img = anim.images[player.frame];

  // anchor position snapped to whole device pixels
  const ax = Math.round(player.x * DPR);
  const ay = Math.round(player.y * DPR);
  const s = SPRITE_SCALE[player.anim] * DPR;

  // turn frames are a front/back view and are never mirrored
  const flip = player.facing === 1 && player.anim !== "turn";

  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(flip ? -s : s, s);
  // BODY anchor sits exactly on (player.x, player.y)
  ctx.drawImage(img, -anim.anchorX, -anim.anchorY);
  ctx.restore();
}

// ==================================================
// LOOP
// ==================================================

let lastTime = 0;

function loop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 100) : 0;
  lastTime = time;

  updatePlayer(dt);
  pressed.clear();
  updateAnimation(dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPlayer();

  requestAnimationFrame(loop);
}

// Make sure the page has keyboard focus from load, and after any click
canvas.tabIndex = 0;
canvas.style.outline = "none";
canvas.focus();
window.addEventListener("pointerdown", () => canvas.focus());

// Build stamp: lets you confirm in DevTools that the browser is not
// running a cached older index.html
console.info("[SUGAR] build: controller-input-fix");

loadAnimations()
  .then(() => {
    // initial spawn only; never reset inside the loop
    player.x = W / 2;
    player.y = H / 2;
    requestAnimationFrame(loop);
  })
  .catch(err => console.error(err));

// Read-only hook for automated checks
window.__ant = player;
</script>

</body>
</html>
