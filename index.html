<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUGAR — Step 2: Idle</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d9d6cf;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// --------------------------------------------------
// SPRITE DATA (GAME_BIBLE §18, §19)
// --------------------------------------------------

const ANIMATIONS = {
  idle: {
    frames: [
      "sprites/idle/idle_01.png",
      "sprites/idle/idle_02.png"
    ],
    interval: 400,
    anchorX: 172,
    anchorY: 93,
    loop: true
  }
};

// --------------------------------------------------
// CANVAS
// --------------------------------------------------

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // resizing the canvas resets context state, so set this every time
  ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);
resize();

// --------------------------------------------------
// ASSET LOADING
// --------------------------------------------------

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load " + src));
    img.src = src;
  });
}

async function loadAnimations() {
  for (const anim of Object.values(ANIMATIONS)) {
    anim.images = await Promise.all(anim.frames.map(loadImage));
  }
}

// --------------------------------------------------
// PLAYER
// --------------------------------------------------

const player = {
  // world position of the BODY anchor
  x: 0,
  y: 0,
  anim: "idle",
  frame: 0,
  frameTime: 0
};

function updateAnimation(dt) {
  const anim = ANIMATIONS[player.anim];
  player.frameTime += dt;

  while (player.frameTime >= anim.interval) {
    player.frameTime -= anim.interval;
    if (anim.loop) {
      player.frame = (player.frame + 1) % anim.images.length;
    } else {
      player.frame = Math.min(player.frame + 1, anim.images.length - 1);
    }
  }
}

function drawPlayer() {
  const anim = ANIMATIONS[player.anim];
  const img = anim.images[player.frame];

  // draw so that the BODY anchor sits exactly on (player.x, player.y)
  const drawX = Math.round(player.x - anim.anchorX);
  const drawY = Math.round(player.y - anim.anchorY);

  ctx.drawImage(img, drawX, drawY);
}

// --------------------------------------------------
// LOOP
// --------------------------------------------------

let lastTime = 0;

function loop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 250) : 0;
  lastTime = time;

  // keep the ant centred while there is no movement yet
  player.x = W / 2;
  player.y = H / 2;

  updateAnimation(dt);

  ctx.clearRect(0, 0, W, H);
  drawPlayer();

  requestAnimationFrame(loop);
}

loadAnimations()
  .then(() => requestAnimationFrame(loop))
  .catch(err => console.error(err));
</script>

</body>
</html>
